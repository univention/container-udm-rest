---
include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.72.0"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/semantic-release-env.yaml"
      - "jobs/container-build-external-buildkit.yaml"
      - "jobs/package-and-publish-helm-charts-external.yaml"
      - "jobs/check-debian-updates.yaml"
      - "templates/sonarqube.yaml"
      - "templates/compose-test.yaml"
  - component: "$CI_SERVER_FQDN/univention/dev/nubus-for-k8s/common-ci/vul-man@v1.72.0"

variables:
  RENOVATE_USER_ID: "1393"

.build-matrix: &build-matrix
  - IMAGE_NAME:
      - "udm-rest-api"
      - "testrunner"
  - IMAGE_NAME: "udm-rest-api-python-client"
    BUILD_TARGET: "final"
    DOCKERFILE_PATH: "docker/udm-rest-api-python-client/Dockerfile"
  - IMAGE_NAME: "udm-cli"
    BUILD_TARGET: "cli"
    BUILD_CONTEXT: "docker/udm-rest-api-python-client"
    DOCKERFILE_PATH: "docker/udm-rest-api-python-client/Dockerfile"
  - IMAGE_NAME: "blocklist-cleanup"
    DOCKERFILE_PATH: "docker/blocklist-cleanup/Dockerfile"

.publish-matrix: &publish-matrix
  - IMAGE_NAME:
      - "udm-rest-api"
      - "udm-rest-api-python-client"
      - "blocklist-cleanup"

container-build:
  parallel:
    matrix: *build-matrix

container-malware-scan:
  parallel:
    matrix: *publish-matrix

container-sign-external:
  parallel:
    matrix: *build-matrix

test-udm-rest:
  extends: ".compose-test"
  stage: "test"
  variables:
    COMPOSE_TEST_SERVICES: "udm-rest-api ldap-server"
  script:
    - docker compose run --quiet-pull --rm test pytest -lvv tests/integration

test-chart-udm-rest-api:
  stage: test
  needs: []
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.24@sha256:1f34d54d23452475db4e92a43b669b8cb1817c4837b0003b2d897d47ed2f9d35"
  script:
    - helm dep build helm/udm-rest-api
    - pytest -W error tests/chart

push-image-external:
  parallel:
    matrix: *publish-matrix

container-release-attestation:
  parallel:
    matrix: *publish-matrix

sbom-upload:
  parallel:
    matrix: *publish-matrix

check-debian-updates:
  parallel:
    matrix: *publish-matrix
  variables:
    TARGET_IMAGE: "${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:latest"

sonarqube:
  extends: .sonarqube
  needs: []
